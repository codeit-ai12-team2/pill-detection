
epochs: 150
batch: 16
imgsz: 640

optimizer: AdamW
lr0: 0.001
cos_lr: true

mosaic: 0.5
mixup: 0.0
copy_paste: 0.0

patience: 30
seed: 42

box: 10.0   # mAP50-95(박스 위치 정밀도) 개선을 위해 기본 7.5보다 올림
dfl: 2.0    # 박스 경계 회귀 정밀도 강화, 기본 1.5보다 올림
scale: 0.0  # 크기(scale) augmentation 끔 - 비슷한 흰색 타원형 알약을 크기 차이로 구분

